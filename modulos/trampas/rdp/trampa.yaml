version: 1
id: rdp
nombre: Remote Desktop (RDP)
descripcion: >-
  A Remote Desktop (RDP) server that looks like a Windows machine with RDP open:
  it negotiates, terminates TLS and asks for credentials through NLA like a real
  one, but gives no one a session and executes nothing. It records every
  connection and negotiation (with the mstshash cookie), the user, domain and
  machine of each sign-in attempt and the NetNTLMv2 hash received; if you set a
  seeded password and someone tries it, it is captured in plaintext. A top
  target for brute force and lateral movement.
alerta:
  fidelidad: interno
ficha:
  detecta: >-
    RDP brute force, credential theft and lateral movement through port 3389:
    sign-in attempts (captures user, domain, machine and the NetNTLMv2 hash so
    you can see who and from where), the tool they use (mstshash cookie and
    JA3/JA4 TLS fingerprint) and, if they try a seeded credential, the plaintext
    password. Anyone touching this 3389 is suspicious.
  donde: >-
    On the server or workstation network, on a Linux machine that does not
    already share RDP, with a believable machine name (TS01, RDS01). RDP is
    among the most scanned and attacked services on the Internet and on internal
    networks; nobody legitimate should try to sign in to this one.
  requisitos:
    - A Linux sensor with Docker (the node's own or one installed on another machine).
    - Open in that machine's firewall the port you choose (3389 is the believable one).
    - On Windows, 3389 is usually held by Terminal Services; use this decoy on a Linux sensor, not on the workstation.
  instalacion:
    automatica: true
versionModulo: 0.1.0
tipo: contenedor
procedencia:
  proyecto: glutton
  url: https://github.com/mushorg/glutton
  licencia: MIT AND BSD-3-Clause

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-rdp:1.0.1-sd3@sha256:707b7d66c6152d00aa2b6bb33e2a82f02dba7bc350cf789f2d2b01ae5bfdc3b2
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-rdp:1.0.1-sd3@sha256:707b7d66c6152d00aa2b6bb33e2a82f02dba7bc350cf789f2d2b01ae5bfdc3b2
  puertos:
    - { interno: 3389, expuesto: '${puertoRdp}', protocolo: tcp }
  entorno:
    SD_GLUTTON_PROTO: rdp
    SD_GLUTTON_MODULE: rdp
    SD_GLUTTON_LISTEN: ':3389'
    SD_GLUTTON_LOG_DIR: /registros
    SD_GLUTTON_EQUIPO: ${nombreEquipo}
    SD_GLUTTON_DOMINIO: ${dominio}
    SD_RDP_DOMINIO_DNS: ${dominioDns}
    SD_RDP_SEGURIDAD: ${seguridad}
    SD_RDP_ACEPTA: ${contrasenaSembrada}
    SD_GLUTTON_MAX_CONN: '128'
    SD_GLUTTON_MAX_CONN_IP: '8'
    SD_GLUTTON_IDLE_S: '30'
    SD_GLUTTON_VIDA_S: '120'
    SD_GLUTTON_MAX_LOG_BYTES: '67108864'
    SD_GLUTTON_LIBRES_TIPO: '64'
    SD_GLUTTON_RESUMEN_S: '300'
    SD_GLUTTON_MAX_IPS: '4096'
    GOMEMLIMIT: 96MiB
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.5
  memoriaMb: 128

parametros:
  type: object
  required: [puertoRdp, nombreEquipo, dominio, seguridad]
  properties:
    puertoRdp:
      type: integer
      title: RDP port
      description: 3389 is the RDP standard and the most believable and attacked. Only if the machine does not already use it for Remote Desktop.
      minimum: 1
      maximum: 65535
      default: 3389
    nombreEquipo:
      type: string
      x-camuflaje: 'equipo:ts'
      title: Computer name
      description: The name it announces in the TLS certificate and in the NTLM challenge. It should fit the servers on the network (TS01, RDS01).
      pattern: '^[A-Za-z0-9-]{1,15}$'
      default: TS01
    dominio:
      type: string
      x-camuflaje: 'netbios'
      title: Domain or workgroup
      description: >-
        The NetBIOS domain or workgroup it announces in the NTLM challenge. Use
        your network's so it looks like one more machine. If it is a workgroup
        (WORKGROUP), the decoy announces its own machine name in the NTLM domain
        fields, like a real standalone Windows.
      pattern: '^[A-Za-z0-9-]{1,15}$'
      default: WORKGROUP
    dominioDns:
      type: string
      x-camuflaje: 'dominio'
      title: DNS domain (FQDN, optional)
      description: >-
        The domain FQDN (e.g. corp.example.com) so the NTLM challenge announces
        that DnsDomainName and the DnsComputerName machine.FQDN, like a real
        domain machine. Leave it empty if it is a workgroup or you do not want
        to announce a DNS domain.
      pattern: '^$|^(?=.{1,253}$)([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,}$'
      maxLength: 253
      default: ''
    seguridad:
      type: string
      title: RDP security
      description: >-
        "nla" (recommended) requires Network Level Authentication like a modern
        Windows: it captures the NetNTLMv2 hash of each attempt. "tls" also lets
        the password arrive in plaintext in the Client Info of clients that do
        not use NLA.
      enum: ['nla', 'tls']
      x-opciones:
        nla: NLA (captures NetNTLMv2; like a modern Windows Server)
        tls: TLS (also allows plaintext password through Client Info)
      default: 'nla'
    contrasenaSembrada:
      type: string
      title: Seeded password (optional)
      description: >-
        If you set one, the decoy ACCEPTS the login that uses it and captures
        the password in plaintext (useful with a decoy credential placed
        elsewhere: you will know if someone tries it against RDP). If you leave
        it empty, all attempts receive "logon failure" and only the NetNTLMv2 is
        captured.
      pattern: '^[\x20-\x7e]{0,128}$'
      maxLength: 128
      default: ''

eventos:
  fuente: { tipo: fichero, ruta: rdp.json }
  formato: json-lineas
  campos:
    cuando: cuando
    ip: src_ip
    puerto: src_port
    usuario: usuario
    equipo: equipo
  accion:
    campo: eventid
    valores:
      rdp.session.connect: conexion
      rdp.session.negotiate: conexion
      rdp.auth: autenticacion
      rdp.auth.aceptado: autenticacion
    porDefecto: otra
  severidad:
    porDefecto: media
    porValor:
      rdp.session.connect: baja
      rdp.session.negotiate: baja
      rdp.auth: alta
      rdp.auth.aceptado: critica
      rdp.exploit: critica
      rdp.log.omitidos: alta
      rdp.session.rechazos: alta
      rdp.error: alta
  conexionEstablecida: true
  detalle:
    - eventid
    - dst_port
    - proto
    - dialecto
    - dominio
    - equipo
    - password
    - ntlm_version
    - ntlm_hash
    - reto
    - ja3
    - ja4
    - variante
    - motivo_cierre
    - omitidos
    - por_tipo
    - ips_ruidosas
    - ips_distintas
    - periodo_s
    - tope_bytes
    - motivo
    - error
  contrasena: password
  sesion: session
  resumen: [dominio, dialecto, ntlm_version, password, ja4, motivo_cierre, omitidos, motivo]
  etiquetas:
    eventid: Event
    dst_port: Port
    proto: Transport
    dialecto: Protocols requested
    dominio: Domain
    equipo: Customer machine
    password: Password (if sent in plaintext)
    ntlm_version: NTLM type
    ntlm_hash: NetNTLMv2 hash (hashcat -m 5600)
    reto: Server challenge (hex)
    ja3: JA3 TLS fingerprint
    ja4: JA4 TLS fingerprint
    variante: Exploitation variant
    motivo_cierre: Reason for closing
    omitidos: Events not recorded
    por_tipo: By event type
    ips_ruidosas: IPs most silenced
    ips_distintas: Distinct IPs silenced
    periodo_s: In the last (s)
    tope_bytes: Daily limit (bytes)
    motivo: Muted because
    error: Log error
    rdp.session.connect: Connection
    rdp.session.negotiate: RDP negotiation (mstshash cookie)
    rdp.auth: Sign-in attempt (NetNTLMv2)
    rdp.auth.aceptado: Sign-in ACCEPTED (seeded password)
    rdp.exploit: Exploitation tool (BlueKeep / MS12-020)
    rdp.session.rechazos: Connections rejected by limit (summary)
    rdp.error: Connection cut off by an internal failure
    rdp.log.omitidos: Events that do not fit (summary)
