# Prueba automática del módulo: herramientas/probar-trampa.sh rdp
# Se despliega la trampa exigiendo NLA y con una contraseña sembrada
# ("Invierno-2026"). Se ataca desde la imagen 'atacante': primero una
# Connection Request con cookie mstshash (como un cliente RDP real), y luego
# rdp_check.py de impacket completando CredSSP/NLA con una contraseña mala y con
# la sembrada. Como rdp_check.py fija el puerto 3389, un reenviador de python
# (3389 -> puerto de la trampa) lo puentea. Las IP son de documentación y los
# valores inofensivos: la trampa no da sesión a nadie ni ejecuta nada.
parametros:
  puertoRdp: 33389
  nombreEquipo: TS01
  dominio: CORP
  dominioDns: ''
  seguridad: 'nla'
  contrasenaSembrada: 'Invierno-2026'
arranque: 3
ataques:
  - imagen: atacante
    puedeFallar: true
    orden:
      - sh
      - -c
      - |
        set -e
        # Esperar a que la trampa conteste (bucle de reintento, como cowrie).
        for i in $(seq 1 30); do
          if python3 -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0 if s.connect_ex(("127.0.0.1",${puertoRdp}))==0 else 1)'; then break; fi
          sleep 1
        done
        # 1) Connection Request X.224 con cookie mstshash (conexión + negociación).
        python3 - <<'PY'
        import socket
        body = b"Cookie: mstshash=probador\r\n" + bytes.fromhex("0100080003000000")
        x224 = bytes([len(body) + 6, 0xe0, 0, 0, 0, 0, 0]) + body
        tpkt = bytes([3, 0, (len(x224) + 4) >> 8, (len(x224) + 4) & 0xff]) + x224
        s = socket.create_connection(("127.0.0.1", ${puertoRdp}), timeout=5)
        s.sendall(tpkt)
        s.recv(64)
        s.close()
        PY
        # 1b) Sonda de BlueKeep/MS12-020: Connection Request clásico (seguridad
        # X.224 estándar, SIN RDP_NEG_REQ, como los escáneres del CVE-2019-0708)
        # y luego un MCS Connect-Initial con el canal MS_T120 y clientName
        # EMP-LAP-0014. Debe dar un rdp.exploit crítico y guardar el equipo.
        python3 - <<'PY'
        import socket
        base = bytes.fromhex(
            "")
        mcs = base.replace(b"cliprdr\x00", b"MS_T120\x00")
        body = b"Cookie: mstshash=Administr\r\n"
        x224 = bytes([len(body) + 6, 0xe0, 0, 0, 0, 0, 0]) + body
        cr = bytes([3, 0, (len(x224) + 4) >> 8, (len(x224) + 4) & 0xff]) + x224
        s = socket.create_connection(("127.0.0.1", ${puertoRdp}), timeout=5)
        s.sendall(cr)
        s.recv(64)
        s.sendall(mcs)
        s.recv(512)
        s.close()
        PY
        # 2) Reenviador 3389 -> puerto de la trampa (rdp_check.py fija el 3389).
        python3 - <<'PY' &
        import socket, threading, time
        def pipe(a, b):
            try:
                while True:
                    d = a.recv(65536)
                    if not d:
                        break
                    b.sendall(d)
            except Exception:
                pass
        srv = socket.socket()
        srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        srv.bind(("127.0.0.1", 3389))
        srv.listen(16)
        def serve():
            while True:
                c, _ = srv.accept()
                u = socket.create_connection(("127.0.0.1", ${puertoRdp}))
                threading.Thread(target=pipe, args=(c, u), daemon=True).start()
                threading.Thread(target=pipe, args=(u, c), daemon=True).start()
        threading.Thread(target=serve, daemon=True).start()
        time.sleep(40)
        PY
        sleep 1
        # 3) CredSSP/NLA: una contraseña mala (NetNTLMv2 capturado, login rechazado)...
        rdp_check.py CORP/administrador:Clave-Incorrecta@127.0.0.1 || true
        # ...y la contraseña sembrada (login ACEPTADO, contraseña en claro capturada).
        rdp_check.py CORP/administrador:Invierno-2026@127.0.0.1 || true
        sleep 1
espera:
  # Hubo sesión TCP completa: el origen no está falseado.
  - { accion: conexion, conexion: true, detalle: { eventid: rdp.session.connect } }
  # La negociación X.224 guarda la cookie mstshash como usuario.
  - {
      accion: conexion,
      severidad: baja,
      usuario: probador,
      detalle: { eventid: rdp.session.negotiate, dialecto: 'TLS' }
    }
  # Un intento de login por NLA con una contraseña mala: alto, con el NetNTLMv2
  # completo (formato hashcat -m 5600: usuario::dominio:reto:proof:blob).
  - {
      accion: autenticacion,
      severidad: alta,
      usuario: administrador,
      detalle:
        {
          eventid: rdp.auth,
          ntlm_version: NTLMv2,
          ntlm_hash: 'administrador::CORP:',
          dominio: CORP
        }
    }
  # El login ACEPTADO con la contraseña sembrada: crítico, con la contraseña en
  # claro capturada del authInfo de CredSSP. Un solo evento con el hash Y la
  # contraseña (no dos a medias).
  - {
      accion: autenticacion,
      severidad: critica,
      usuario: administrador,
      detalle: { eventid: rdp.auth.aceptado, password: Invierno-2026 }
    }
  # La sonda MS_T120 (BlueKeep/MS12-020): rdp.exploit crítico, con la variante y
  # el nombre de equipo del cliente que antes se perdía.
  - {
      accion: otra,
      severidad: critica,
      detalle: { eventid: rdp.exploit, variante: MS_T120, equipo: EMP-LAP-0014 }
    }
tiempo: 25
