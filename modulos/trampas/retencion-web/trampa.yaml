version: 1
id: retencion-web
nombre: Web tarpit (HTTP tarpit)
descripcion: >-
  A web server that answers any path with a made-up file (configuration,
  credentials, database backups) sent byte by byte, very slowly. It records
  every request, the tool that launches it and how much time the trapped scanner
  loses.
alerta:
  fidelidad: internet
ficha:
  detecta: >-
    Scanners and worms sweeping the network for files with secrets (.env,
    .git/config, database backups, cloud credentials): their IP, the paths they
    try, the tool they use and how much time they lose trapped. From the fourth
    request of the same IP, each response takes longer, so the sweep stretches
    over hours.
  donde: >-
    On a web port (8080, 80) of the server network, the DMZ or the management
    VLAN, where nobody browses: any request that arrives is from someone
    exploring.
  requisitos:
    - A Linux sensor with Docker (the node's own or one installed on another machine).
    - Open in that machine's firewall the port you choose.
    - 160 MB of free memory. With many scanners at once it uses at most a quarter of a core and less than 1 Mbit/s.
    - The fake files carry made-up keys in AWS format. If a DLP or an IDS watches that network, it may alert.
  instalacion:
    automatica: true
versionModulo: 0.1.2
tipo: contenedor
procedencia:
  proyecto: go-pot
  url: https://github.com/ryanolee/go-pot
  licencia: MIT

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-retencion-web:1.1.2-sd5@sha256:72c4447344b2ff16ef5371d4d51ca005a1ced3b3ab055ae12d791cb58664d824
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-retencion-web:1.1.2-sd5@sha256:72c4447344b2ff16ef5371d4d51ca005a1ced3b3ab055ae12d791cb58664d824
  puertos:
    - { interno: 8080, expuesto: '${puerto}', protocolo: tcp }
  entorno:
    GOPOT__SERVER__HOST: 0.0.0.0
    GOPOT__SERVER__PORT: '8080'
    GOPOT__SERVER__NETWORK: tcp4
    GOPOT__SERVER__PROXY_HEADER: ''
    GOPOT__SERVER__ACCESS_LOG__MODE: both
    GOPOT__SERVER__ACCESS_LOG__PATH: rotar:///registros/go-pot.json?tope_mb=60
    GOPOT__SERVER__ACCESS_LOG__FIELDS_TO_LOG: id,phase,src_ip,src_port,method,host,path,qs,user_agent,duration
    GOPOT__LOGGING__LEVEL: warn
    GOPOT__STALLER__MAXIMUM_CONNECTIONS: '200'
    GOPOT__STALLER__GROUP_LIMIT: '50'
    GOPOT__STALLER__BYTES_PER_SECOND: '8'
    GOPOT__CLUSTER__ENABLED: 'false'
    GOPOT__TELEMETRY__ENABLED: 'false'
    GOPOT__TELEMETRY__PROMETHEUS__ENABLED: 'false'
    GOPOT__TELEMETRY__PUSH_GATEWAY__ENABLED: 'false'
    GOPOT__RECAST__ENABLED: 'false'
    GOPOT__FTP_SERVER__ENABLED: 'false'
    GOPOT__TIMEOUT_WATCHER__ENABLED: 'true'
    GOMEMLIMIT: 120MiB
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.25
  memoriaMb: 160

parametros:
  type: object
  required: [puerto]
  properties:
    puerto:
      type: integer
      title: Port
      description: 8080 or 80 are the believable ones for an internal web server, if the machine does not already use them.
      minimum: 1
      maximum: 65535
      default: 8080

eventos:
  fuente: { tipo: fichero, ruta: go-pot.json }
  formato: json-lineas
  campos:
    cuando: ts
    ip: src_ip
    puerto: src_port
  accion:
    campo: phase
    valores:
      start: lectura
      end: otra
      error: otra
      rechazos: conexion
      callados: otra
    porDefecto: otra
  severidad:
    porDefecto: media
    porValor:
      end: baja
      callados: alta
      tope: alta
  conexionEstablecida: true
  sesion: id
  detalle:
    - phase
    - method
    - host
    - path
    - qs
    - user_agent
    - duration
    - id
    - status
    - peticion
    - sin_apuntar
    - de_su_ip
    - por_cupo_ip
    - por_tope_dia
    - rechazadas
    - por_tope_global
    - por_tope_ip
    - desalojadas
    - ips_distintas
    - ips_sin_contar
    - activas
    - periodo_s
    - tope_bytes
    - aviso
  resumen:
    [method, path, user_agent, duration, status, peticion, sin_apuntar, rechazadas, desalojadas]
  etiquetas:
    phase: Phase
    method: Method
    host: Host requested
    path: Path
    qs: Parameters
    user_agent: Tool
    duration: Held (s)
    id: Request
    status: Response
    peticion: Request received
    sin_apuntar: Lines not recorded
    de_su_ip: From this IP
    por_cupo_ip: By its IP's quota
    por_tope_dia: By the daily limit
    rechazadas: Connections rejected
    por_tope_global: By the total limit
    por_tope_ip: By its IP's limit
    desalojadas: Evicted to make room for another IP
    ips_distintas: Distinct IPs
    ips_sin_contar: From other IPs not counted
    activas: Open connections
    periodo_s: In the last (s)
    tope_bytes: Daily limit (bytes)
    aviso: Alert
    start: Requests a file
    end: Released
    error: Request that does not reach the tarpit
    rechazos: Connections rejected or evicted by limit (summary)
    callados: They keep hitting it; theirs comes out summarized
    tope: Today's log is full; until tomorrow, summaries only
