version: 1
id: impresora
nombre: Network printer
descripcion: >-
  An office printer that answers like a real one on 9100 (RAW/PJL), 631 (IPP)
  and an administration web page, but prints and executes nothing. It records
  reconnaissance and file theft through PJL (PRET), jobs (fingerprint and size
  only), sign-in attempts and the change of the LDAP/SMTP server to the
  attacker's (passback).
alerta:
  fidelidad: ruidosa
ficha:
  detecta: >-
    Anyone looking for printers on the network and trying to exploit them: PJL
    reconnaissance commands (@PJL INFO), listing and reading the printer's files
    with path traversal (FSDIRLIST, FSUPLOAD, PRET style), panel defacement
    (RDYMSG), IPP requests and print jobs, default credentials tried on the web
    page and, the most valuable signal, "passback": the attacker points the LDAP
    or SMTP server to their own to keep the service account, and leaves their
    machine's IP.
  donde: >-
    Where a printer would be: the office network, a print VLAN or a DMZ. With
    ports 9100, 631 and 80, which show up in any attacker's internal
    reconnaissance (nmap). On a machine that is not already your print server.
  requisitos:
    - A Linux sensor with Docker (the node's own or one installed on another machine).
    - Open in that machine's firewall the ports you enable (9100 and, if you enable them, 631 and 80).
    - Do not put it on a machine that already uses 9100, 631 (cupsd) or 80 for its own service.
    - 'Your own vulnerability scanners (Nessus, Qualys) will touch it: keep their IPs at hand to tell them apart.'
  instalacion:
    automatica: true
versionModulo: 0.1.0
tipo: contenedor
procedencia:
  proyecto: Sugardaddy (SeguridadSI)
  url: https://github.com/kinomakino/sugardaddy
  licencia: Código propio (SeguridadSI); biblioteca estándar de Go, BSD-3-Clause

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-impresora:0.1.2@sha256:21b5d4ff810b092a85c9bec9d8ce0b886518eb66a10335845c6da8f11e56f9cb
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-impresora:0.1.2@sha256:21b5d4ff810b092a85c9bec9d8ce0b886518eb66a10335845c6da8f11e56f9cb
  puertos:
    - { interno: 9100, expuesto: '${puertoRaw}', protocolo: tcp }
    - { interno: 1631, expuesto: '${puertoIpp}', protocolo: tcp, si: ipp }
    - { interno: 1080, expuesto: '${puertoWeb}', protocolo: tcp, si: web }
  entorno:
    SD_IMPRESORA_RAW: 'on'
    SD_IMPRESORA_RAW_LISTEN: ':9100'
    SD_IMPRESORA_IPP:
      segun: ipp
      valores: { 'yes': 'on', 'no': 'off' }
    SD_IMPRESORA_IPP_LISTEN: ':1631'
    SD_IMPRESORA_WEB:
      segun: web
      valores: { 'yes': 'on', 'no': 'off' }
    SD_IMPRESORA_WEB_LISTEN: ':1080'
    SD_IMPRESORA_LOG: /registros/impresora.json
    SD_IMPRESORA_PUERTO_IPP: '${puertoIpp}'
    SD_IMPRESORA_PUERTO_WEB: '${puertoWeb}'
    SD_IMPRESORA_MODELO: ${modelo}
    SD_IMPRESORA_NOMBRE: ${nombreEquipo}
    SD_IMPRESORA_UBICACION: ${ubicacion}
    SD_IMPRESORA_SEMILLA: ''
    SD_IMPRESORA_MAX_CONN: '256'
    SD_IMPRESORA_MAX_CONN_IP: '16'
    SD_IMPRESORA_MAX_LINE_BYTES: '8192'
    SD_IMPRESORA_MAX_REQ_BYTES: '262144'
    SD_IMPRESORA_MAX_BODY_MEM: '32768'
    SD_IMPRESORA_MAX_JOB_BYTES: '4194304'
    SD_IMPRESORA_MAX_LOG_BYTES: '67108864'
    SD_IMPRESORA_RESUMEN_S: '300'
    GOMEMLIMIT: 48MiB
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.5
  memoriaMb: 64

parametros:
  type: object
  required: [puertoRaw, ipp, puertoIpp, web, puertoWeb, modelo]
  properties:
    puertoRaw:
      type: integer
      title: RAW/JetDirect port
      description: 9100 is the direct-printing standard, the most believable and the most sought after. Only change it if the machine already uses it.
      minimum: 1
      maximum: 65535
      default: 9100
    ipp:
      type: string
      title: Enable IPP (631)
      description: The modern printing port (IPP/CUPS). Believable for drivers and for ipptool. Turn it off if the machine already has a cupsd on 631.
      enum: ['yes', 'no']
      default: 'yes'
    puertoIpp:
      type: integer
      title: IPP port
      description: 631 is the IPP standard. It is also the one the printer announces in its URLs, so it must be the one the attacker reaches.
      minimum: 1
      maximum: 65535
      default: 631
    web:
      type: string
      title: Enable the administration web page (80)
      description: The printer's administration page, where login attempts and the change of the LDAP/SMTP server (passback) are seen. Turn it off if the machine already has a web server on 80.
      enum: ['yes', 'no']
      default: 'yes'
    puertoWeb:
      type: integer
      title: Web port
      description: 80 is the web standard for a printer's web page. It is the one it announces in its links, so it must be the one the attacker reaches.
      minimum: 1
      maximum: 65535
      default: 80
    modelo:
      type: string
      title: Model it pretends to be
      description: >-
        The model returned by @PJL INFO ID and shown by the web page and IPP.
        Leave it on "auto" so the decoy uses a realistic one derived from its
        seed (different for each decoy). If you enter a text, it will be the
        exact model. No real manufacturer is impersonated.
      pattern: '^[\x20-\x7e]{1,80}$'
      maxLength: 80
      default: 'auto'
    nombreEquipo:
      type: string
      x-camuflaje: 'host:prn'
      title: Computer name
      description: >-
        The printer's network name (the one the web page shows and IPP
        announces). It should fit how you name printers on your network. Empty
        (normal in mass deployments), it is derived from the seed, different for
        each decoy: this way thousands of deployments do not all announce the
        same name, which would be a common fingerprint of the decoy.
      pattern: '^[A-Za-z0-9-]{0,63}$'
      default: ''
    ubicacion:
      type: string
      title: Location
      description: The physical location the printer shows (e.g. "Floor 2 - Administration"). Empty, it is derived from the seed.
      maxLength: 120
      default: ''

eventos:
  fuente: { tipo: fichero, ruta: impresora.json }
  formato: json-lineas
  campos:
    cuando: cuando
    ip: src_ip
    puerto: src_port
    usuario: usuario
  accion:
    campo: eventid
    valores:
      impresora.session.connect: conexion
      impresora.session.rechazos: conexion
      impresora.session.tope: conexion
      impresora.pjl.info: comando
      impresora.pjl.fs: lectura
      impresora.pjl.traversal: lectura
      impresora.pjl.escritura: escritura
      impresora.pjl.control: comando
      impresora.pjl.job: escritura
      impresora.ps.peligroso: comando
      impresora.ipp.peticion: comando
      impresora.ipp.trabajo: escritura
      impresora.web.get: comando
      impresora.web.login: autenticacion
      impresora.web.passback: escritura
      impresora.web.config: escritura
    porDefecto: otra
  severidad:
    porDefecto: media
    porAccion:
      conexion: baja
      autenticacion: alta
      comando: media
      lectura: media
      escritura: media
    porValor:
      impresora.session.connect: baja
      impresora.pjl.info: media
      impresora.pjl.fs: media
      impresora.pjl.traversal: critica
      impresora.pjl.escritura: alta
      impresora.pjl.control: alta
      impresora.ps.peligroso: critica
      impresora.ipp.peticion: baja
      impresora.web.get: baja
      impresora.web.passback: critica
      impresora.web.config: alta
      impresora.session.rechazos: alta
      impresora.session.tope: alta
      impresora.log.tope: alta
      impresora.log.omitidos: alta
      impresora.log.error: alta
  conexionEstablecida: true
  detalle:
    - eventid
    - servicio
    - comando
    - args
    - ruta
    - operacion
    - recurso
    - metodo
    - agente
    - usuario
    - password
    - texto
    - campo
    - valor
    - servidor
    - huella
    - tam
    - grave
    - motivo
    - omitidos
    - omitidos_graves
    - omitidos_auth
    - rechazadas
    - de_su_ip
    - por_tope_global
    - por_tope_ip
    - ips_distintas
    - ips_sin_contar
    - activas
    - periodo_s
    - perdidos
    - error
    - aviso
    - tope_bytes
  contrasena: password
  sesion: session
  resumen:
    [
      servicio,
      comando,
      operacion,
      ruta,
      usuario,
      password,
      texto,
      servidor,
      campo,
      valor,
      huella,
      tam,
      grave,
      aviso
    ]
  etiquetas:
    servicio: Service
    comando: PJL command
    args: Arguments
    ruta: Path
    operacion: IPP operation
    recurso: Resource
    metodo: HTTP method
    agente: Client (User-Agent)
    usuario: User
    password: Password
    texto: Text
    campo: Field
    valor: Value
    servidor: Attacker's server
    huella: Job fingerprint (sha256)
    tam: Size (bytes)
    grave: Why it is critical
    motivo: Muted because
    omitidos: Events not recorded
    omitidos_graves: Of which, critical
    omitidos_auth: Of which, passwords
    rechazadas: Connections rejected
    de_su_ip: From this IP
    por_tope_global: By the total limit
    por_tope_ip: By its IP's limit
    ips_distintas: Distinct IPs
    ips_sin_contar: Rejections from other IPs not counted
    activas: Simultaneous connections
    periodo_s: In the last (s)
    perdidos: Events lost (disk)
    error: Log error
    aviso: Alert
    tope_bytes: Daily limit (bytes)
