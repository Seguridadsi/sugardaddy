    valores:
      impresora.session.connect: conexion
      impresora.session.rechazos: conexion
      impresora.session.tope: conexion
      impresora.pjl.info: comando
      impresora.pjl.fs: lectura
      impresora.pjl.traversal: lectura
      impresora.pjl.escritura: escritura
      impresora.pjl.control: comando
      impresora.pjl.job: escritura
      impresora.ps.peligroso: comando
      impresora.ipp.peticion: comando
      impresora.ipp.trabajo: escritura
      impresora.web.get: comando
      impresora.web.login: autenticacion
      impresora.web.passback: escritura
      impresora.web.config: escritura
    porDefecto: otra
  severidad:
