    impresora.session.rechazos: Connections rejected (summary)
    impresora.session.tope: Connection cut off by limit
    impresora.pjl.info: PJL reconnaissance
    impresora.pjl.fs: Access to the printer's files
    impresora.pjl.traversal: File theft with path traversal
    impresora.pjl.escritura: Write/delete on the printer
    impresora.pjl.control: Panel control (defacement/lock)
    impresora.pjl.job: Print job
    impresora.ps.peligroso: Dangerous PostScript (file theft/control)
