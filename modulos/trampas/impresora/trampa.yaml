version: 1
id: impresora
nombre: Impresora de red
descripcion: >-
  Una impresora de oficina que contesta como una de verdad en 9100 (RAW/PJL), 631 (IPP) y
  una web de administración, pero no imprime ni ejecuta nada. Registra el reconocimiento y el
  robo de ficheros por PJL (PRET), los trabajos (solo huella y tamaño), los intentos de
  inicio de sesión y el cambio del servidor LDAP/SMTP por el del atacante (passback).
alerta:
  fidelidad: ruidosa
ficha:
  detecta: >-
    Quien busca impresoras en la red y trata de aprovecharlas: comandos PJL de reconocimiento
    (@PJL INFO), listado y lectura de ficheros de la impresora con recorrido de rutas
    (FSDIRLIST, FSUPLOAD, estilo PRET), desfiguración del panel (RDYMSG), peticiones IPP y
    trabajos de impresión, credenciales por defecto probadas en la web y, la señal más
    valiosa, el «passback»: el atacante apunta el servidor LDAP o SMTP al suyo para quedarse
    la cuenta de servicio, y deja la IP de su equipo.
  donde: >-
    Donde habría una impresora: la red de la oficina, una VLAN de impresión o una DMZ. Con
    los puertos 9100, 631 y 80, que salen en el reconocimiento interno (nmap) de cualquier
    atacante. En una máquina que no sea ya tu servidor de impresión.
  requisitos:
    - Un sensor Linux con Docker (el del nodo o uno instalado en otra máquina).
    - Abrir en el cortafuegos de esa máquina los puertos que enciendas (9100 y, si los activas, 631 y 80).
    - No la pongas en una máquina que ya use el 9100, el 631 (cupsd) o el 80 para su propio servicio.
    - 'Los escáneres de vulnerabilidades propios (Nessus, Qualys) la tocarán: ten a mano sus IP para distinguirlas.'
  instalacion:
    automatica: true
versionModulo: 0.1.0
tipo: contenedor
procedencia:
  proyecto: Sugardaddy (SeguridadSI)
  url: https://github.com/kinomakino/sugardaddy
  licencia: Código propio (SeguridadSI); biblioteca estándar de Go, BSD-3-Clause

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-impresora:0.1.1@sha256:d0ec1bc22f6b6713f61e922e98f240a82e593024f802593ef2e49c2ba9d9b01f
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-impresora:0.1.1@sha256:d0ec1bc22f6b6713f61e922e98f240a82e593024f802593ef2e49c2ba9d9b01f
  puertos:
    - { interno: 9100, expuesto: '${puertoRaw}', protocolo: tcp }
    - { interno: 1631, expuesto: '${puertoIpp}', protocolo: tcp, si: ipp }
    - { interno: 1080, expuesto: '${puertoWeb}', protocolo: tcp, si: web }
  entorno:
    SD_IMPRESORA_RAW: 'on'
    SD_IMPRESORA_RAW_LISTEN: ':9100'
    SD_IMPRESORA_IPP:
      segun: ipp
      valores: { 'yes': 'on', 'no': 'off' }
    SD_IMPRESORA_IPP_LISTEN: ':1631'
    SD_IMPRESORA_WEB:
      segun: web
      valores: { 'yes': 'on', 'no': 'off' }
    SD_IMPRESORA_WEB_LISTEN: ':1080'
    SD_IMPRESORA_LOG: /registros/impresora.json
    SD_IMPRESORA_PUERTO_IPP: '${puertoIpp}'
    SD_IMPRESORA_PUERTO_WEB: '${puertoWeb}'
    SD_IMPRESORA_MODELO: ${modelo}
    SD_IMPRESORA_NOMBRE: ${nombreEquipo}
    SD_IMPRESORA_UBICACION: ${ubicacion}
    SD_IMPRESORA_SEMILLA: ''
    SD_IMPRESORA_MAX_CONN: '256'
    SD_IMPRESORA_MAX_CONN_IP: '16'
    SD_IMPRESORA_MAX_LINE_BYTES: '8192'
    SD_IMPRESORA_MAX_REQ_BYTES: '262144'
    SD_IMPRESORA_MAX_BODY_MEM: '32768'
    SD_IMPRESORA_MAX_JOB_BYTES: '4194304'
    SD_IMPRESORA_MAX_LOG_BYTES: '67108864'
    SD_IMPRESORA_RESUMEN_S: '300'
    GOMEMLIMIT: 48MiB
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.5
  memoriaMb: 64

parametros:
  type: object
  required: [puertoRaw, ipp, puertoIpp, web, puertoWeb, modelo]
  properties:
    puertoRaw:
      type: integer
      title: Puerto RAW/JetDirect
      description: El 9100 es el estándar de impresión directa, el más creíble y el más buscado. Solo cámbialo si la máquina ya lo usa.
      minimum: 1
      maximum: 65535
      default: 9100
    ipp:
      type: string
      title: Encender IPP (631)
      description: El puerto de impresión moderno (IPP/CUPS). Creíble para los drivers y para ipptool. Apágalo si la máquina ya tiene un cupsd en el 631.
      enum: ['yes', 'no']
      default: 'yes'
    puertoIpp:
      type: integer
      title: Puerto IPP
      description: El 631 es el estándar de IPP. Es también el que anuncia la impresora en sus URL, así que debe ser el que el atacante alcanza.
      minimum: 1
      maximum: 65535
      default: 631
    web:
      type: string
      title: Encender la web de administración (80)
      description: La página de administración de la impresora, donde se ven los intentos de login y el cambio del servidor LDAP/SMTP (passback). Apágala si la máquina ya tiene un servidor web en el 80.
      enum: ['yes', 'no']
      default: 'yes'
    puertoWeb:
      type: integer
      title: Puerto web
      description: El 80 es el estándar de la web de una impresora. Es el que anuncia en sus enlaces, así que debe ser el que el atacante alcanza.
      minimum: 1
      maximum: 65535
      default: 80
    modelo:
      type: string
      title: Modelo que finge ser
      description: >-
        El modelo que devuelve @PJL INFO ID y que muestra la web e IPP. Déjalo en «auto» para
        que la trampa use uno realista derivado de su semilla (distinto en cada trampa). Si
        pones un texto, será el modelo exacto. No se suplanta a ningún fabricante real.
      pattern: '^[\x20-\x7e]{1,80}$'
      maxLength: 80
      default: 'auto'
    nombreEquipo:
      type: string
      x-camuflaje: 'host:prn'
      title: Nombre del equipo
      description: >-
        El nombre de red de la impresora (el que muestra la web y anuncia IPP). Que encaje
        con cómo nombras las impresoras en tu red. Vacío (lo normal en despliegues masivos),
        lo deriva de la semilla, distinto en cada trampa: así miles de despliegues no
        anuncian todos el mismo nombre, que sería una huella común de la trampa.
      pattern: '^[A-Za-z0-9-]{0,63}$'
      default: ''
    ubicacion:
      type: string
      title: Ubicación
      description: La ubicación física que muestra la impresora (p. ej. «Planta 2 - Administración»). Vacía, la deriva de la semilla.
      maxLength: 120
      default: ''

eventos:
  fuente: { tipo: fichero, ruta: impresora.json }
  formato: json-lineas
  campos:
    cuando: cuando
    ip: src_ip
    puerto: src_port
    usuario: usuario
  accion:
