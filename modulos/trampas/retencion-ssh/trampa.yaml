version: 1
id: retencion-ssh
nombre: SSH or banner tarpit
descripcion: >-
  A port that looks like an SSH, or the service its greeting announces, and
  never gets past the welcome: whoever connects is left waiting for hours,
  without even getting to authenticate. It records who connects, with which
  client they arrive and how much time they lose.
alerta:
  fidelidad: internet
ficha:
  detecta: >-
    Anyone trying to connect over SSH, or to the service the greeting announces,
    and with which client they arrive (OpenSSH, libssh, paramiko, Go, or the
    first command they send). It holds them for hours without letting them even
    authenticate, so automatic sweeps get stuck on this machine.
  donde: >-
    On 22 or 2222 of servers that have no SSH. In greeting mode, on ports of
    services that do not exist on that machine (21 FTP, 23 Telnet, 25 SMTP, 3306
    MySQL...), with a greeting that fits the port.
  requisitos:
    - A Linux sensor with Docker (the node's own or one installed on another machine).
    - Open in that machine's firewall the port you choose.
    - 64 MB of free memory. With a thousand held connections it uses 21 MB and less than 10 KB/s.
  instalacion:
    automatica: true
versionModulo: 0.1.0
tipo: contenedor
procedencia:
  proyecto: Sugardaddy (SeguridadSI)
  url: https://github.com/kinomakino/sugardaddy
  licencia: Código propio (SeguridadSI); biblioteca estándar de Go, BSD-3-Clause

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-retencion-ssh:0.2.3@sha256:1fafc436c9d353cb51578419075f37d68292447926fcf8ce83f4d0bba7f31ebf
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-retencion-ssh:0.2.3@sha256:1fafc436c9d353cb51578419075f37d68292447926fcf8ce83f4d0bba7f31ebf
  puertos:
    - { interno: 2222, expuesto: '${puerto}', protocolo: tcp }
  entorno:
    RETEN_PUERTO: '2222'
    RETEN_MODO: ${modo}
    RETEN_BANNER: ${banner}
    RETEN_RETARDO_S: ${retardo}
    RETEN_DURACION_MAX_H: ${duracionMaxHoras}
    RETEN_REGISTRO: /registros/reten.json
    RETEN_MAX_CONEXIONES: '1024'
    RETEN_MAX_POR_IP: '32'
    RETEN_RESUMEN_S: '60'
    RETEN_TOPE_DIA_MB: '60'
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.25
  memoriaMb: 64

parametros:
  type: object
  required: [puerto, modo, retardo, duracionMaxHoras]
  properties:
    puerto:
      type: integer
      title: Port
      description: >-
        2222 or 22 in SSH mode (22 only if the machine does not already use 22
        for its real SSH). In greeting mode, that of the service it pretends to
        be: 21, 23, 25, 3306...
      minimum: 1
      maximum: 65535
      default: 2222
    modo:
      type: string
      title: What it pretends to be
      description: >-
        SSH holds SSH clients before authentication. Greeting sends the text
        below, as an FTP, an SMTP or a database would, and answers nothing else.
      enum: [ssh, banner]
      x-opciones:
        ssh: An SSH server
        banner: Another service (fixed greeting)
      default: ssh
    banner:
      type: string
      title: Greeting
      description: >-
        Only matters in greeting mode. The first line whoever connects will see,
        exactly as the program it pretends to be gives it and fitting the port:
        "220 (vsFTPd 3.0.5)" on 21, "220 mail.tuempresa.local ESMTP Postfix" on
        25. Text without accents or line breaks, up to 200 characters.
      pattern: '^[\x20-\x7e]{1,200}$'
      maxLength: 200
      default: 220 (vsFTPd 3.0.5)
    retardo:
      type: integer
      title: Seconds between lines
      description: >-
        In SSH mode, how often it sends a line. With 10 almost no client gives
        up and it barely uses any network.
      minimum: 1
      maximum: 60
      default: 10
    duracionMaxHoras:
      type: integer
      title: Hours at most per connection
      description: After this time it is released, so a forgotten connection does not occupy a slot forever.
      minimum: 1
      maximum: 168
      default: 24

eventos:
  fuente: { tipo: fichero, ruta: reten.json }
  formato: json-lineas
  campos:
    cuando: ts
    ip: src_ip
    puerto: src_port
  accion:
    campo: evento
    valores:
      conexion: conexion
      rechazos: conexion
      cliente: otra
      fin: otra
      callados: otra
    porDefecto: otra
  severidad:
    porDefecto: media
    porValor:
      cliente: baja
      fin: baja
      callados: alta
      tope: alta
  conexionEstablecida: true
  sesion: id
  detalle:
    - evento
    - modo
    - datos
    - duracion_s
    - bytes
    - recibidos
    - motivo
    - rechazadas
    - por_tope_global
    - por_tope_ip
    - de_su_ip
    - ips_distintas
    - ips_sin_contar
    - activas
    - periodo_s
    - sin_apuntar
    - por_cupo_ip
    - por_tope_dia
    - tope_bytes
    - aviso
  resumen: [datos, duracion_s, motivo, rechazadas, sin_apuntar]
  etiquetas:
    evento: What happens
    modo: Mode
    datos: Client or first command
    duracion_s: Held (s)
    bytes: Bytes sent
    recibidos: Bytes received
    motivo: Released by
    rechazadas: Connections rejected
    por_tope_global: By the total limit
    por_tope_ip: By its IP's limit
    de_su_ip: From this IP
    ips_distintas: Distinct IPs
    ips_sin_contar: From other IPs not counted
    activas: Connections held
    periodo_s: In the last (s)
    sin_apuntar: Lines not recorded
    por_cupo_ip: By its IP's quota
    por_tope_dia: By the daily limit
    tope_bytes: Daily limit (bytes)
    aviso: Alert
    conexion: Connects
    cliente: Identifies itself
    fin: Released
    rechazos: Rejected due to limit (summary)
    callados: They keep hitting it; theirs comes out summarized
    tope: Today's log is full; until tomorrow, summaries only
