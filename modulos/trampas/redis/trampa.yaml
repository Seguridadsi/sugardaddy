version: 1
id: redis
nombre: Redis open or with password
descripcion: >-
  A Redis server that accepts connections and answers like a real one, but
  executes nothing it is asked. It records every command, marks as critical what
  worms do (persistence, replication, module loading, database wipe) and stores
  every password tried.
alerta:
  fidelidad: interno
ficha:
  detecta: >-
    Anyone looking for unprotected Redis servers: the commands they issue,
    whether they try to mine or persist (cron, SSH keys), whether they try to
    turn the server into a replica of theirs (SLAVEOF) or load a module to
    execute code, and the passwords they try if you set one.
  donde: >-
    Where an attacker would expect an exposed cache or in-memory database: the
    server network, an application's backend or a DMZ. With port 6379, the most
    sought after.
  requisitos:
    - A Linux sensor with Docker (the node's own or one installed on another machine).
    - Open in that machine's firewall the port you choose.
  instalacion:
    automatica: true
versionModulo: 0.3.0
tipo: contenedor
procedencia:
  proyecto: Sugardaddy (SeguridadSI)
  url: https://github.com/kinomakino/sugardaddy
  licencia: Código propio (SeguridadSI); biblioteca estándar de Go, BSD-3-Clause

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-redis:7.2.4-sd6@sha256:6d1ed9f78e4b90eac04ef47dbc26dd4580a28dbed839685c7be75a47bba4f3c3
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-redis:7.2.4-sd6@sha256:6d1ed9f78e4b90eac04ef47dbc26dd4580a28dbed839685c7be75a47bba4f3c3
  puertos:
    - { interno: 6379, expuesto: '${puertoRedis}', protocolo: tcp }
  entorno:
    SD_REDIS_LISTEN: ':6379'
    SD_REDIS_LOG: /registros/redis.json
    SD_REDIS_VERSION: ${version}
    SD_REDIS_PUERTO: '${puertoRedis}'
    SD_REDIS_PASSWORD: ${contrasena}
    SD_REDIS_SEMILLA: ''
    SD_REDIS_MAX_CONN: '512'
    SD_REDIS_MAX_CONN_IP: '8'
    SD_REDIS_MAX_CMD_BYTES: '65536'
    SD_REDIS_MAX_KEYS: '256'
    SD_REDIS_MAX_KEYS_IP: '32'
    SD_REDIS_MAX_VALUE_KB: '64'
    SD_REDIS_MAX_KEYSPACE_MB: '8'
    SD_REDIS_MAX_CLIENTS_MEM_MB: '12'
    SD_REDIS_KEY_LIFE_MIN: '30'
    SD_REDIS_MAX_LOG_BYTES: '67108864'
    SD_REDIS_RESUMEN_S: '300'
    GOMEMLIMIT: 48MiB
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.5
  memoriaMb: 64

parametros:
  type: object
  required: [puertoRedis, version]
  properties:
    puertoRedis:
      type: integer
      title: Redis port
      description: 6379 is the standard, the most believable and the most attacked. Only if the machine does not already use it for its real Redis.
      minimum: 1
      maximum: 65535
      default: 6379
    version:
      type: string
      title: Version it pretends to be
      description: The version that INFO and HELLO announce. It only changes the text, not the behavior.
      enum: ['7.2.4', '7.0.15', '6.2.14']
      x-opciones:
        '7.2.4': Redis 7.2.4
        '7.0.15': Redis 7.0.15
        '6.2.14': Redis 6.2.14
      default: '7.2.4'
    contrasena:
      type: string
      title: Password
      description: >-
        If you leave it empty, the decoy pretends to be an open Redis (no AUTH),
        which is what worms attack most. If you set one, it requires AUTH and
        stores every password tried.
      pattern: '^[\x21-\x7e]{0,128}$'
      maxLength: 128
      default: ''

eventos:
  fuente: { tipo: fichero, ruta: redis.json }
  formato: json-lineas
  campos:
    cuando: cuando
    ip: src_ip
    puerto: src_port
  accion:
    campo: eventid
    valores:
      redis.session.connect: conexion
      redis.session.rechazos: conexion
      redis.session.tope: conexion
      redis.auth: autenticacion
      redis.command.input: comando
      redis.command.grave: comando
    porDefecto: otra
  severidad:
    porDefecto: media
    porAccion:
      autenticacion: alta
      comando: media
    porValor:
      redis.command.grave: critica
      redis.session.rechazos: alta
      redis.session.tope: alta
      redis.log.tope: alta
      redis.log.omitidos: alta
      redis.log.error: alta
      redis.session.connect: baja
      redis.session.closed: baja
  conexionEstablecida: true
  detalle:
    - eventid
    - comando
    - args
    - usuario
    - password
    - grave
    - session
    - duration
    - motivo
    - omitidos
    - omitidos_graves
    - omitidos_auth
    - rechazadas
    - de_su_ip
    - por_tope_global
    - por_tope_ip
    - ips_distintas
    - ips_sin_contar
    - activas
    - periodo_s
    - perdidos
    - error
    - aviso
    - tope_bytes
  contrasena: password
  sesion: session
  resumen: [comando, args, grave, password, rechazadas, omitidos, motivo, aviso, duration]
  etiquetas:
    comando: Command
    args: Arguments
    usuario: User
    password: Password
    grave: Why it is critical
    session: Session
    duration: Duration (s)
    motivo: Muted because
    omitidos: Events not recorded
    omitidos_graves: Of which, critical
    omitidos_auth: Of which, passwords
    rechazadas: Connections rejected
    de_su_ip: From this IP
    por_tope_global: By the total limit
    por_tope_ip: By its IP's limit
    ips_distintas: Distinct IPs
    ips_sin_contar: Rejections from other IPs not counted
    activas: Simultaneous connections
    periodo_s: In the last (s)
    perdidos: Events lost (disk)
    error: Log error
    aviso: Alert
    tope_bytes: Daily limit (bytes)
    redis.session.connect: Connection
    redis.session.rechazos: Connections rejected (summary)
    redis.session.tope: Connection cut off by memory limit
    redis.auth: Password test
    redis.command.input: Command
    redis.command.grave: Dangerous command
    redis.session.closed: Leaves
    redis.log.tope: Today's log is full; nothing more is recorded until tomorrow
    redis.log.omitidos: Events that do not fit (summary)
    redis.log.error: Failed to write the log
