version: 1
id: login-web
nombre: Web login portal with decoy credential
descripcion: >-
  An HTTP login portal that pretends to be an internal website (intranet,
  administration panel or employee portal). It answers every credential tried
  with a believable error page and accepts the decoy credential, showing fake
  content. It records every user and password tried in full, flags SQL
  injections and Path Traversal, raises a sign-in with the decoy credential to
  high, and flags an attacker driving an AI agent: the form carries a note that
  only an AI agent reads and follows.
alerta:
  fidelidad: interno
ficha:
  detecta: >-
    Anyone attacking the login form of an internal website: brute force and
    credential spraying (every user and password tried is recorded in full),
    anyone reusing the seeded decoy credential (it is accepted, fake content is
    shown and the access rises to high) and anyone trying SQL injection or Path
    Traversal. Probes and scanners come out with low severity. It also tells
    you when the attacker is an AI agent: the form carries a note no person
    sees; whoever requests the page it points to is suspected, and whoever then
    does what that page says is flagged.
  donde: >-
    On the internal network, on 8080 or the web port you choose: where an
    attacker already inside the network looks for the intranet, the
    administration panel or the employee portal. Any credential tried against an
    internal portal is a strong signal: nobody signs in to the intranet from a
    brute-force tool by accident.
  requisitos:
    - A Linux sensor with Docker (the node's own or one installed on another machine).
    - Open in that machine's firewall the port you choose.
    - The chosen port must be free (the machine must not already have its own website).
  instalacion:
    automatica: true
versionModulo: 0.1.1
tipo: contenedor
procedencia:
  proyecto: Sugardaddy (SeguridadSI)
  url: https://github.com/kinomakino/sugardaddy
  licencia: Código propio (SeguridadSI); biblioteca estándar de Go, BSD-3-Clause

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-login-web:0.1.11@sha256:3a230187151f60863115537f7f46262bdbad3317236123b7a7711873aebce8db
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-login-web:0.1.11@sha256:3a230187151f60863115537f7f46262bdbad3317236123b7a7711873aebce8db
  puertos:
    - { interno: 8080, expuesto: '${puertoWeb}', protocolo: tcp }
  entorno:
    SD_LOGINWEB_LISTEN: ':8080'
    SD_LOGINWEB_LOG: /registros/login-web.json
    SD_LOGINWEB_PLANTILLA: ${plantilla}
    SD_LOGINWEB_USUARIO: ${usuarioCebo}
    SD_LOGINWEB_PASSWORD: ${contrasenaCebo}
    SD_LOGINWEB_PUERTO: '${puertoWeb}'
    SD_LOGINWEB_SEMILLA: ''
    SD_LOGINWEB_NOTA_AGENTES: ${notaAgentes}
    SD_LOGINWEB_RETO_AGENTES: ${retoAgentes}
    SD_LOGINWEB_IDIOMA: ${idioma}
    SD_LOGINWEB_MAX_CONN: '512'
    SD_LOGINWEB_MAX_CONN_IP: '32'
    SD_LOGINWEB_MAX_CUERPO_BYTES: '8192'
    SD_LOGINWEB_MAX_LOG_BYTES: '67108864'
    SD_LOGINWEB_RESUMEN_S: '300'
    GOMEMLIMIT: 48MiB
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.5
  memoriaMb: 64

parametros:
  type: object
  required: [puertoWeb, plantilla]
  properties:
    puertoWeb:
      type: integer
      title: Portal port
      description: 8080 is the most believable for an internal website, and the one scanners look for most. Only if the machine does not already use it for its real website.
      minimum: 1
      maximum: 65535
      default: 8080
    plantilla:
      type: string
      title: Portal it pretends to be
      description: >-
        Changes the look of the form and the fake content shown after the decoy
        login. Title and texts consistent with the chosen portal.
      enum: ['intranet', 'admin', 'portal']
      x-opciones:
        'intranet': Corporate intranet
        'admin': Administration panel
        'portal': Employee portal
      default: 'intranet'
    usuarioCebo:
      type: string
      title: Decoy user
      description: The user the decoy accepts when used with the decoy password. admin by default, the most sought after.
      pattern: '^[\x21-\x7e]{1,63}$'
      maxLength: 63
      default: 'admin'
    contrasenaCebo:
      type: string
      title: Decoy password
      description: >-
        If you leave it empty, the decoy accepts NO login: it only detects and
        stores each attempt (credential spraying). If you set one, it accepts
        that user and password, shows the portal's fake content and records the
        access as high: that credential can only come from a data theft.
      pattern: '^[\x21-\x7e]{0,128}$'
      maxLength: 128
      default: 'admin'
    notaAgentes:
      type: string
      title: Note for AI agents
      description: >-
        Adds to the sign-in form a note that a person does not see, asking AI
        assistants and automated agents to read a policy page before using the
        form. Whoever requests that page is recorded as a suspected AI agent,
        and whoever then does what the page says is recorded as a confirmed
        one. When it is off, the form carries no note, the page does not exist
        and none of these events are raised. The note is visible to anyone who
        reads the source code of the page.
      enum: ['si', 'no']
      x-opciones:
        'si': 'On'
        'no': 'Off'
      default: 'si'
    retoAgentes:
      type: string
      title: Fake challenge for AI agents
      description: >-
        Answers the first page request from each address that presents itself as
        Chrome with a fake Cloudflare "Just a moment..." check (403), and lets
        every later request through: a person sees the check once and gets in on
        reload. The CyberStrike and PentestCode AI agents answer that check by
        retrying under their own name, which is recorded as a confirmed AI agent
        with the tool's name. The same page requested twice at once with a
        browser User-Agent, as PentAGI's headless browser does, is recorded as a
        possible PentAGI. Turn it off if a one-off check page in front of this
        decoy matters more to you than detecting these agents.
      enum: ['si', 'no']
      x-opciones:
        'si': 'On'
        'no': 'Off'
      default: 'si'
    idioma:
      type: string
      title: Decoy language
      description: >-
        The language of everything an attacker sees on this decoy: the sign-in
        form, its error messages and the portal shown after signing in. Choose
        the one your organisation works in, so the portal fits in with the rest
        of your intranet. It does not change the events or what this console
        shows.
      enum: ['en', 'es']
      x-opciones:
        'en': 'English'
        'es': 'Spanish'
      default: 'en'

eventos:
  fuente: { tipo: fichero, ruta: login-web.json }
  formato: json-lineas
  campos:
    cuando: cuando
    ip: src_ip
    puerto: src_port
  accion:
    campo: eventid
    valores:
      web.session.connect: conexion
      web.sondeo: conexion
      web.session.tope: conexion
      web.session.rechazos: conexion
      web.login: autenticacion
      web.login.cebo: autenticacion
      web.comando: comando
      web.agente.lee: conexion
      web.agente.obedece: conexion
      web.agente.reto: conexion
      web.agente.herramienta: conexion
      web.agente.doble_carga: conexion
    porDefecto: otra
  severidad:
    porDefecto: media
    porValor:
      web.login.cebo: alta
      web.comando: alta
      web.agente.obedece: alta
      web.agente.herramienta: alta
      web.agente.doble_carga: media
      web.agente.reto: baja
      web.session.rechazos: alta
      web.session.tope: alta
      web.log.tope: alta
      web.log.omitidos: alta
      web.log.error: alta
      web.sondeo: baja
      web.session.connect: baja
      web.session.closed: baja
  conexionEstablecida: true
  coste: { tiempo: duration }
  detalle:
    - eventid
    - usuario
    - password
    - ruta
    - metodo
    - agente
    - resultado
    - grave
    - agente_ia
    - herramienta_ia
    - motivo
    - duration
    - omitidos
    - omitidos_cebo
    - omitidos_login
    - rechazadas
    - de_su_ip
    - por_tope_global
    - por_tope_ip
    - ips_distintas
    - ips_sin_contar
    - activas
    - periodo_s
    - perdidos
    - error
    - aviso
    - tope_bytes
  sesion: session
  contrasena: password
  resumen:
    [
      usuario,
      password,
      ruta,
      agente,
      resultado,
      grave,
      motivo,
      rechazadas,
      omitidos,
      aviso,
      duration
    ]
  etiquetas:
    usuario: User tried
    password: Password tried
    ruta: Path
    metodo: Method
    agente: Tool (User-Agent)
    resultado: Result
    grave: Why it is critical
    motivo: Reason
    omitidos: Events not recorded
    omitidos_cebo: Of which, decoy logins
    omitidos_login: Of which, credentials tried
    rechazadas: Connections rejected
    de_su_ip: From this IP
    por_tope_global: By the total limit
    por_tope_ip: By its IP's limit
    ips_distintas: Distinct IPs
    ips_sin_contar: Rejections from other IPs not counted
    activas: Simultaneous connections
    periodo_s: In the last (s)
    perdidos: Events lost (disk)
    error: Log error
    aviso: Alert
    tope_bytes: Daily limit (bytes)
    duration: Duration (s)
    session: Session
    web.session.connect: Connection
    web.sondeo: Probe (scanner, nonexistent path, odd request)
    web.session.tope: Request cut off by size limit
    web.session.rechazos: Connections rejected (summary)
    web.login: Login rejected (credential tried)
    web.login.cebo: Login ACCEPTED with the decoy credential
    web.comando: Injection or Path Traversal
    web.session.closed: Leaves
    web.log.tope: Today's log is full; nothing more is recorded until tomorrow
    web.log.omitidos: Events that do not fit (summary)
    web.log.error: Failed to write the log
    herramienta_ia: AI agent tool
    web.agente.reto: Fake Cloudflare challenge shown (first Chrome request from this address)
    web.agente.herramienta: AI agent named by its retry after the fake challenge
    web.agente.doble_carga: Same page loaded twice at once (possible PentAGI)
