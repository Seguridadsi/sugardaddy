version: 1
id: dns-ntp
nombre: DNS, NTP y UPnP falsos
descripcion: >-
  Un servidor de nombres, de hora y UPnP que contesta como uno de verdad (BIND o dnsmasq,
  ntpd, MiniDLNA o MiniUPnPd) pero no resuelve nada para nadie. Registra transferencias de
  zona, consultas de versión, monlist, búsquedas UPnP y las ráfagas de quien intenta usarlo
  para atacar a otros. A Internet nunca le contesta con más bytes de los que recibe.
alerta:
  fidelidad: ruidosa
ficha:
  detecta: >-
    Quien busca servidores DNS, de hora (NTP) o UPnP en tu red: transferencias de zona
    (AXFR), consultas de versión, consultas ANY, barridos de nombres, monlist y búsquedas
    UPnP. Apunta cada petición (hasta 50 por equipo y servicio cada diez minutos desde
    direcciones privadas, 5 desde Internet) y, al que insiste o falsifica su dirección para
    atacar a otro, deja de contestarle y lo marca como ráfaga. Si una inundación le obliga a
    callar, lo dice cada minuto en un aviso, sin perder las peticiones por TCP.
  donde: >-
    En la red de servidores o en la DMZ, en una máquina que no sea ya tu DNS ni tu servidor
    de hora, con un nombre de servidor de nombres o de hora (ns2, ntp01). Dentro de la red
    avisa de quien hace reconocimiento; expuesta a Internet enseña a quien busca servidores
    para usarlos en ataques, sin que tu IP les sirva para ello.
  requisitos:
    - Un sensor Linux con Docker, versión 0.13 o posterior.
    - Abrir en el cortafuegos de esa máquina 53 UDP y TCP, 123 UDP o 1900 UDP, según lo que enciendas.
    - En Ubuntu el 53 lo ocupa systemd-resolved; pon DNSStubListener=no en /etc/systemd/resolved.conf o elige otro puerto.
    - Pon tus redes en «Redes internas»; solo sus equipos reciben las respuestas completas (monlist, búsquedas UPnP, version.bind). Pruébala desde uno de ellos; desde la propia máquina contesta lo mínimo.
    - Si un cortafuegos delante cambia la IP de origen (Azure Firewall con DNAT, VIP con NAT de origen), no pongas su red en «Redes internas», porque todo Internet llegaría desde ella.
    - No sustituye a un DNS de verdad ni resuelve para nadie; a los nombres de tu dominio contesta REFUSED, como un servidor cerrado.
    - Fuera de tus redes internas nunca contesta con más bytes de los que recibe (sin monlist ni búsquedas UPnP) y a version.bind contesta REFUSED, por UDP y por TCP.
    - Si activas «Respuestas completas también a Internet», tu IP puede acabar en listas de reflectores y tu proveedor puede avisarte.
    - Si la expones a Internet, avisa a tu proveedor; los proyectos que rastrean Internet la verán como un servidor DNS.
  instalacion:
    automatica: true
versionModulo: 0.2.1
sensorMinimo: 0.13.0
tipo: contenedor
procedencia:
  proyecto: DDoSPot
  url: https://github.com/telekom-security/ddospot
  licencia: MIT

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-dns-ntp:2.0.1-sd5@sha256:0d685ed0ce8db6ffa413cdc0a1a53462e29b434e8a46a38c9da40414a00fa6e5
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-dns-ntp:2.0.1-sd5@sha256:0d685ed0ce8db6ffa413cdc0a1a53462e29b434e8a46a38c9da40414a00fa6e5
  puertos:
    - { interno: 1053, expuesto: '${puertoDns}', protocolo: udp, si: dns }
    - { interno: 1053, expuesto: '${puertoDns}', protocolo: tcp, si: dns }
    - { interno: 1123, expuesto: '${puertoNtp}', protocolo: udp, si: ntp }
    - { interno: 11900, expuesto: '${puertoSsdp}', protocolo: udp, si: ssdp }
  entorno:
    DDOSPOT_DNS_RECURSION: 'off'
    DDOSPOT_DNS_PORT: '1053'
    DDOSPOT_NTP_PORT: '1123'
    DDOSPOT_SSDP_PORT: '11900'
    DDOSPOT_PUBLIC_AMPLIFICATION:
      segun: respuestasInternet
      valores: { 'yes': 'on', 'no': 'off' }
    DDOSPOT_INTERNAL_NETS: ${redesInternas}
    DDOSPOT_LOG_FILE: ddospot.json
    DDOSPOT_MAX_LOG_BYTES: '52428800'
    DDOSPOT_LOG_REQUESTS: 'on'
    DDOSPOT_LOG_BLOCKED: 'on'
    DDOSPOT_PRIVATE_BUDGET: '50'
    DDOSPOT_MAX_SOURCES: '50000'
    DDOSPOT_PERSONA: ${sistema}
    DDOSPOT_HOSTNAME: ${nombreEquipo}
    DDOSPOT_SEED: ${nombreEquipo}
    DDOSPOT_SEED_FILE: persona.semilla
    GOMEMLIMIT: 100MiB
  registros: /var/log/ddospot

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.25
  memoriaMb: 128

parametros:
  type: object
  required:
    [nombreEquipo, sistema, dns, puertoDns, ntp, puertoNtp, ssdp, puertoSsdp, respuestasInternet]
  properties:
    nombreEquipo:
      type: string
      x-camuflaje: 'host:ns'
      title: Nombre del equipo
      description: El que devuelve hostname.bind (solo BIND). Que encaje con los servidores de nombres de la red.
      pattern: '^[a-zA-Z0-9-]{1,63}$'
      default: ns2
    sistema:
      type: string
      title: Sistema que finge ser
      description: >-
        Cambia las versiones que anuncia. Solo CentOS contesta a monlist (ntpd 4.2.6), como
        los servidores viejos que buscan los atacantes, y solo a tus redes internas.
      enum: [centos7, centos6, debian11, ubuntu2004]
      x-opciones:
        centos7: CentOS 7 (BIND 9.11, ntpd 4.2.6, MiniDLNA)
        centos6: CentOS 6 (BIND 9.8, ntpd 4.2.6, MiniDLNA)
        debian11: Debian 11 (dnsmasq 2.85, ntpd 4.2.8, MiniUPnPd)
        ubuntu2004: Ubuntu 20.04 (dnsmasq 2.90, ntpd 4.2.8, MiniDLNA)
      default: centos7
    dns:
      type: string
      title: DNS
      enum: ['yes', 'no']
      x-opciones: { 'yes': Sí, 'no': 'No' }
      default: 'yes'
    puertoDns:
      type: integer
      title: Puerto DNS (UDP y TCP)
      description: Solo cuenta si DNS está en Sí. El 53 es el creíble.
      minimum: 1
      maximum: 65535
      default: 53
    ntp:
      type: string
      title: NTP
      enum: ['yes', 'no']
      x-opciones: { 'yes': Sí, 'no': 'No' }
      default: 'yes'
    puertoNtp:
      type: integer
      title: Puerto NTP (UDP)
      description: Solo cuenta si NTP está en Sí. El 123 es el creíble.
      minimum: 1
      maximum: 65535
      default: 123
    ssdp:
      type: string
      title: SSDP (UPnP)
      description: >-
        Un servidor de nombres con UPnP es raro; enciéndelo si la máquina debe parecer un NAS o
        un equipo multimedia. Nadie sirve la página que anuncia (LOCATION): quien la pida verá
        que no hay nada.
      enum: ['yes', 'no']
      x-opciones: { 'yes': Sí, 'no': 'No' }
      default: 'no'
    puertoSsdp:
      type: integer
      title: Puerto SSDP (UDP)
      description: Solo cuenta si SSDP está en Sí. El 1900 es el creíble.
      minimum: 1
      maximum: 65535
      default: 1900
    redesInternas:
      type: string
      title: Redes internas
      description: >-
        Las de tu red, separadas por comas (10.20.0.0/16, 192.168.1.0/24). Solo sus equipos
        reciben las respuestas completas (monlist, búsquedas UPnP, version.bind), las que más
        engañan a quien hace reconocimiento. Vacío: nadie. No pongas la red de un cortafuegos o
        balanceador que cambie la IP de origen de lo que entra (Azure Firewall con DNAT, una
        VIP con NAT de origen): todo Internet llegaría desde ella y tu IP serviría de reflector.
      pattern: '^(|((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([89]|[12][0-9]|3[0-2])(, ?((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([89]|[12][0-9]|3[0-2])){0,31})$'
      maxLength: 640
      default: ''
    respuestasInternet:
      type: string
      title: Respuestas completas también a Internet
      description: >-
        Con No (lo recomendado), fuera de tus redes internas nunca contesta con más bytes de los
        que recibe: sin monlist ni búsquedas UPnP, y a version.bind con REFUSED, como un
        servidor que solo atiende a su red. Así tu IP no sirve para amplificar ataques. Con Sí
        contesta a todos como un servidor real (hasta 5 veces por origen cada diez minutos) y
        tu IP puede acabar en listas de reflectores abiertos y en quejas a tu proveedor.
      enum: ['yes', 'no']
      x-opciones: { 'yes': 'Sí (tu IP puede salir como reflector)', 'no': 'No' }
      default: 'no'

eventos:
  fuente: { tipo: fichero, ruta: ddospot.json }
  formato: json-lineas
  campos:
    cuando: time
    ip: src_ip
    puerto: src_port
  accion:
    campo: event
    valores:
      request: conexion
      scanner: conexion
      attack_start: conexion
    porDefecto: otra
  severidad:
    porDefecto: media
    porValor:
      attack_start: alta
      net_start: alta
      attack_end: baja
      net_end: baja
      log_full: alta
      log_dropped: media
    porCampo:
      campo: dns_type
      valores:
        AXFR: alta
        IXFR: alta
  conexionEstablecida: false
  conexionPorCampo:
    campo: proto
    valores: { tcp: true, udp: false }
  detalle:
    - event
    - pot
    - dest_port
    - proto
    - packets
    - dns_name
    - dns_type
    - dns_cls
    - opcode
    - mode
    - st
    - mx
    - req_size
    - resp_size
    - amp_guard
    - target_ip
    - target_port
    - target_net
    - sources
    - first_seen
    - last_seen
    - attack_seconds
    - persona
    - max_bytes
    - kind
    - kind_bytes
    - dropped
    - dropped_udp
    - dropped_tcp
    - dropped_targets
    - limits
    - top_sources
    - untracked
  resumen:
    [
      pot,
      dns_name,
      dns_type,
      mode,
      st,
      amp_guard,
      target_ip,
      target_net,
      packets,
      kind,
      dropped,
      top_sources
    ]
  etiquetas:
    event: Tipo
    pot: Servicio
    dest_port: Puerto
    proto: Transporte
    packets: Paquetes del origen
    dns_name: Nombre consultado
    dns_type: Tipo de registro
    dns_cls: Clase
    opcode: Código de operación
    mode: Modo NTP
    st: Busca (ST)
    mx: Espera (MX)
    req_size: Tamaño de la petición
    resp_size: Tamaño de la respuesta
    amp_guard: Respuesta frenada (recortada, sin respuesta o rechazada)
    target_ip: Dirección de la ráfaga (escáner insistente o víctima)
    target_port: Puerto de la ráfaga
    target_net: Red bloqueada
    sources: Orígenes en la red
    first_seen: Primer paquete
    last_seen: Último paquete
    attack_seconds: Duración (s)
    persona: Sistema fingido
    max_bytes: Tope diario (bytes)
    kind: Clase de líneas
    kind_bytes: Parte del día de la clase (bytes)
    dropped: Líneas calladas
    dropped_udp: Peticiones UDP calladas
    dropped_tcp: Peticiones TCP calladas
    dropped_targets: Ráfagas calladas
    limits: Por qué (ritmo, cupo del origen, reparto o tope del día)
    top_sources: Orígenes con más líneas calladas
    untracked: Paquetes sin apuntar (tablas llenas)
    request: Petición
    scanner: Visita
    attack_start: Ráfaga (escaneo insistente o reflexión)
    attack_end: Fin de la ráfaga
    net_start: Red entera sin respuesta
    net_end: Fin del bloqueo de la red
    log_full: Parte del registro de hoy gastada, esa clase se resume hasta mañana
    log_dropped: Líneas calladas en el último minuto
