version: 1
id: dns-ntp
nombre: Fake DNS, NTP and UPnP
descripcion: >-
  A name, time and UPnP server that answers like a real one (BIND or dnsmasq,
  ntpd, MiniDLNA or MiniUPnPd) but resolves nothing for anyone. It records zone
  transfers, version queries, monlist, UPnP searches and the bursts of anyone
  trying to use it to attack others. It never answers the Internet with more
  bytes than it receives.
alerta:
  fidelidad: ruidosa
ficha:
  detecta: >-
    Anyone looking for DNS, time (NTP) or UPnP servers on your network: zone
    transfers (AXFR), version queries, ANY queries, name sweeps, monlist and
    UPnP searches. It records every request (up to 50 per machine and service
    every ten minutes from private addresses, 5 from the Internet) and, for
    anyone who insists or spoofs their address to attack another, it stops
    answering and marks them as a burst. If a flood forces it to go quiet, it
    says so every minute in an alert, without losing the requests over TCP.
  donde: >-
    On the server network or in the DMZ, on a machine that is not already your
    DNS or your time server, with a name server or time server name (ns2,
    ntp01). Inside the network it alerts on anyone doing reconnaissance; exposed
    to the Internet it shows who is looking for servers to use in attacks,
    without your IP being of any use to them for that.
  requisitos:
    - A Linux sensor with Docker, version 0.13 or later.
    - Open in that machine's firewall 53 UDP and TCP, 123 UDP or 1900 UDP, depending on what you enable.
    - On Ubuntu, 53 is held by systemd-resolved; set DNSStubListener=no in /etc/systemd/resolved.conf or choose another port.
    - >-
      Add your networks under "Internal networks": only their machines get the
      full responses (monlist, UPnP searches, version.bind). Test it from one of
      them; the machine itself gets the bare minimum.
    - If a firewall in front changes the source IP (Azure Firewall with DNAT, VIP with source NAT), do not put its network under "Internal networks", because the whole Internet would arrive from it.
    - It does not replace a real DNS or resolve for anyone; for names in your domain it answers REFUSED, like a closed server.
    - Outside your internal networks it never answers with more bytes than it receives (no monlist or UPnP searches) and to version.bind it answers REFUSED, over UDP and TCP.
    - If you enable "Full responses to the Internet too", your IP may end up on reflector lists and your provider may warn you.
    - If you expose it to the Internet, notify your provider; projects that scan the Internet will see it as a DNS server.
  instalacion:
    automatica: true
versionModulo: 0.2.1
sensorMinimo: 0.13.0
tipo: contenedor
procedencia:
  proyecto: DDoSPot
  url: https://github.com/telekom-security/ddospot
  licencia: MIT

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-dns-ntp:2.0.1-sd7@sha256:2af5ee69a00f978fea2e4208b8bf4b391cc575304ea036731184d5c8a42a5177
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-dns-ntp:2.0.1-sd7@sha256:2af5ee69a00f978fea2e4208b8bf4b391cc575304ea036731184d5c8a42a5177
  puertos:
    - { interno: 1053, expuesto: '${puertoDns}', protocolo: udp, si: dns }
    - { interno: 1053, expuesto: '${puertoDns}', protocolo: tcp, si: dns }
    - { interno: 1123, expuesto: '${puertoNtp}', protocolo: udp, si: ntp }
    - { interno: 11900, expuesto: '${puertoSsdp}', protocolo: udp, si: ssdp }
  entorno:
    DDOSPOT_DNS_RECURSION: 'off'
    DDOSPOT_DNS_PORT: '1053'
    DDOSPOT_NTP_PORT: '1123'
    DDOSPOT_SSDP_PORT: '11900'
    DDOSPOT_PUBLIC_AMPLIFICATION:
      segun: respuestasInternet
      valores: { 'yes': 'on', 'no': 'off' }
    DDOSPOT_INTERNAL_NETS: ${redesInternas}
    DDOSPOT_LOG_FILE: ddospot.json
    DDOSPOT_MAX_LOG_BYTES: '52428800'
    DDOSPOT_LOG_REQUESTS: 'on'
    DDOSPOT_LOG_BLOCKED: 'on'
    DDOSPOT_PRIVATE_BUDGET: '50'
    DDOSPOT_MAX_SOURCES: '50000'
    DDOSPOT_PERSONA: ${sistema}
    DDOSPOT_HOSTNAME: ${nombreEquipo}
    DDOSPOT_SEED: ${nombreEquipo}
    DDOSPOT_SEED_FILE: persona.semilla
    GOMEMLIMIT: 100MiB
  registros: /var/log/ddospot

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.25
  memoriaMb: 128

parametros:
  type: object
  required:
    [nombreEquipo, sistema, dns, puertoDns, ntp, puertoNtp, ssdp, puertoSsdp, respuestasInternet]
  properties:
    nombreEquipo:
      type: string
      x-camuflaje: 'host:ns'
      title: Computer name
      description: The one hostname.bind returns (BIND only). It should fit the name servers on the network.
      pattern: '^[a-zA-Z0-9-]{1,63}$'
      default: ns2
    sistema:
      type: string
      title: System it pretends to be
      description: >-
        Changes the versions it announces. Only CentOS answers monlist (ntpd
        4.2.6), like the old servers attackers look for, and only to your
        internal networks.
      enum: [centos7, centos6, debian11, ubuntu2004]
      x-opciones:
        centos7: CentOS 7 (BIND 9.11, ntpd 4.2.6, MiniDLNA)
        centos6: CentOS 6 (BIND 9.8, ntpd 4.2.6, MiniDLNA)
        debian11: Debian 11 (dnsmasq 2.85, ntpd 4.2.8, MiniUPnPd)
        ubuntu2004: Ubuntu 20.04 (dnsmasq 2.90, ntpd 4.2.8, MiniDLNA)
      default: centos7
    dns:
      type: string
      title: DNS
      enum: ['yes', 'no']
      x-opciones: { 'yes': Yes, 'no': 'No' }
      default: 'yes'
    puertoDns:
      type: integer
      title: DNS port (UDP and TCP)
      description: Only matters if DNS is set to Yes. 53 is the believable one.
      minimum: 1
      maximum: 65535
      default: 53
    ntp:
      type: string
      title: NTP
      enum: ['yes', 'no']
      x-opciones: { 'yes': Yes, 'no': 'No' }
      default: 'yes'
    puertoNtp:
      type: integer
      title: NTP port (UDP)
      description: Only matters if NTP is set to Yes. 123 is the believable one.
      minimum: 1
      maximum: 65535
      default: 123
    ssdp:
      type: string
      title: SSDP (UPnP)
      description: >-
        A name server with UPnP is unusual; enable it if the machine should look
        like a NAS or a media machine. Nobody serves the page it announces
        (LOCATION): whoever requests it will see there is nothing.
      enum: ['yes', 'no']
      x-opciones: { 'yes': Yes, 'no': 'No' }
      default: 'no'
    puertoSsdp:
      type: integer
      title: SSDP port (UDP)
      description: Only matters if SSDP is set to Yes. 1900 is the believable one.
      minimum: 1
      maximum: 65535
      default: 1900
    redesInternas:
      type: string
      title: Internal networks
      description: >-
        Those of your network, comma-separated (10.20.0.0/16, 192.168.1.0/24).
        Only their machines receive the full responses (monlist, UPnP searches,
        version.bind), the ones that fool reconnaissance best. Empty: nobody. Do
        not enter the network of a firewall or load balancer that changes the
        source IP of what comes in (Azure Firewall with DNAT, a VIP with source
        NAT): the whole Internet would arrive from it and your IP would serve as
        a reflector.
      pattern: '^(|((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([89]|[12][0-9]|3[0-2])(, ?((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([89]|[12][0-9]|3[0-2])){0,31})$'
      maxLength: 640
      default: ''
    respuestasInternet:
      type: string
      title: Full responses to the Internet too
      description: >-
        With No (recommended), outside your internal networks it never answers
        with more bytes than it receives: no monlist or UPnP searches, and
        REFUSED to version.bind, like a server that only serves its own network.
        This way your IP cannot be used to amplify attacks. With Yes it answers
        everyone like a real server (up to 5 times per source every ten minutes)
        and your IP may end up on open reflector lists and in complaints to your
        provider.
      enum: ['yes', 'no']
      x-opciones: { 'yes': Yes (your IP may appear as a reflector), 'no': 'No' }
      default: 'no'

eventos:
  fuente: { tipo: fichero, ruta: ddospot.json }
  formato: json-lineas
  campos:
    cuando: time
    ip: src_ip
    puerto: src_port
  accion:
    campo: event
    valores:
      request: conexion
      scanner: conexion
      attack_start: conexion
    porDefecto: otra
  severidad:
    porDefecto: media
    porValor:
      attack_start: alta
      net_start: alta
      attack_end: baja
      net_end: baja
      log_full: alta
      log_dropped: media
    porCampo:
      campo: dns_type
      valores:
        AXFR: alta
        IXFR: alta
  conexionEstablecida: false
  conexionPorCampo:
    campo: proto
    valores: { tcp: true, udp: false }
  detalle:
    - event
    - pot
    - dest_port
    - proto
    - packets
    - dns_name
    - dns_type
    - dns_cls
    - opcode
    - mode
    - st
    - mx
    - req_size
    - resp_size
    - amp_guard
    - target_ip
    - target_port
    - target_net
    - sources
    - first_seen
    - last_seen
    - attack_seconds
    - persona
    - max_bytes
    - kind
    - kind_bytes
    - dropped
    - dropped_udp
    - dropped_tcp
    - dropped_targets
    - limits
    - top_sources
    - untracked
  resumen:
    [
      pot,
      dns_name,
      dns_type,
      mode,
      st,
      amp_guard,
      target_ip,
      target_net,
      packets,
      kind,
      dropped,
      top_sources
    ]
  etiquetas:
    event: Type
    pot: Service
    dest_port: Port
    proto: Transport
    packets: Packets from the source
    dns_name: Name queried
    dns_type: Record type
    dns_cls: Class
    opcode: Operation code
    mode: NTP mode
    st: Looks for (ST)
    mx: Waits (MX)
    req_size: Request size
    resp_size: Response size
    amp_guard: Throttled response (truncated, no response or refused)
    target_ip: Burst address (insistent scanner or victim)
    target_port: Burst port
    target_net: Blocked network
    sources: Sources in the network
    first_seen: First packet
    last_seen: Last packet
    attack_seconds: Duration (s)
    persona: Simulated system
    max_bytes: Daily limit (bytes)
    kind: Line class
    kind_bytes: Share of the day for the class (bytes)
    dropped: Lines silenced
    dropped_udp: UDP requests silenced
    dropped_tcp: TCP requests silenced
    dropped_targets: Bursts silenced
    limits: Why (rate, source quota, share or daily limit)
    top_sources: Sources with the most silenced lines
    untracked: Packets not recorded (tables full)
    request: Request
    scanner: Visit
    attack_start: Burst (insistent scanning or reflection)
    attack_end: End of the burst
    net_start: Whole network left unanswered
    net_end: End of the network block
    log_full: Share of today's log used up; that class is summarized until tomorrow
    log_dropped: Lines silenced in the last minute
