version: 1
id: smb
nombre: Shared folder (SMB)
descripcion: >-
  A Windows file server (SMB) that looks like a network shared folder: it
  negotiates, accepts sign-in and answers like a real one, but serves and
  executes nothing. It records every negotiation, the user, domain and machine
  that authenticate (with the NetNTLMv2 hash if it arrives), the resource they
  connect to, the files they open or try to write (name, fingerprint and size
  only) and probes from worms such as EternalBlue and DoublePulsar, marked as
  critical.
alerta:
  fidelidad: interno
ficha:
  detecta: >-
    Lateral movement and worms on your network over SMB (port 445): sign-in
    attempts with credential theft (captures user, domain, machine and the
    NetNTLMv2 hash so you can see who and from where), connection to shared
    resources, opening and writing files, and EternalBlue/DoublePulsar
    (MS17-010) probes, the vector of WannaCry and NotPetya.
  donde: >-
    On the server or workstation network, on a machine that does not already
    share files over SMB, with a believable file server name (FS01, NAS01). It
    is the number one vector for ransomware and credential theft: anyone
    touching this 445 is suspicious.
  requisitos:
    - A Linux sensor with Docker (the node's own or one installed on another machine).
    - Open in that machine's firewall the port you choose (445 is the believable one).
    - On Windows, 445 is held by the system itself; use this decoy on a Linux sensor, not on the workstation.
  instalacion:
    automatica: true
versionModulo: 0.1.0
tipo: contenedor
procedencia:
  proyecto: glutton
  url: https://github.com/mushorg/glutton
  licencia: MIT AND BSD-3-Clause

contenedor:
  imagen: ghcr.io/seguridadsi/sugardaddy-registro-smb:1.0.1-sd3@sha256:3bef46abb3d72f70a575a2907717fecfb7da61ab366aafa5cc04796736511a02
  imagenPublica: ghcr.io/seguridadsi/sugardaddy-registro-smb:1.0.1-sd3@sha256:3bef46abb3d72f70a575a2907717fecfb7da61ab366aafa5cc04796736511a02
  puertos:
    - { interno: 1445, expuesto: '${puertoSmb}', protocolo: tcp }
  entorno:
    SD_GLUTTON_PROTO: smb
    SD_GLUTTON_MODULE: smb
    SD_GLUTTON_LISTEN: ':1445'
    SD_GLUTTON_LOG_DIR: /registros
    SD_GLUTTON_EQUIPO: ${nombreEquipo}
    SD_GLUTTON_DOMINIO: ${dominio}
    SD_GLUTTON_RECURSOS: ${recursos}
    SD_GLUTTON_MAX_CONN: '128'
    SD_GLUTTON_MAX_CONN_IP: '8'
    SD_GLUTTON_IDLE_S: '30'
    SD_GLUTTON_VIDA_S: '120'
    SD_GLUTTON_MAX_LOG_BYTES: '67108864'
    SD_GLUTTON_LIBRES_TIPO: '64'
    SD_GLUTTON_PRIORITARIOS: 'smb.exploit,smb.session.auth'
    SD_GLUTTON_LIBRES_PRIO: '128'
    SD_GLUTTON_RESUMEN_S: '300'
    SD_GLUTTON_MAX_IPS: '4096'
    SD_GLUTTON_MAX_FILE_BYTES: '1048576'
    SD_GLUTTON_MAX_TX_BYTES: '1048576'
    SD_GLUTTON_MAX_CONN_BYTES: '4194304'
    GOMEMLIMIT: 96MiB
  registros: /registros

aislamiento:
  salida: false
  soloLectura: true
  cpu: 0.5
  memoriaMb: 128

parametros:
  type: object
  required: [puertoSmb, nombreEquipo, dominio]
  properties:
    puertoSmb:
      type: integer
      title: SMB port
      description: 445 is the SMB standard and the most believable and attacked. Only if the machine does not already use it to share files.
      minimum: 1
      maximum: 65535
      default: 445
    nombreEquipo:
      type: string
      x-camuflaje: 'equipo:fs'
      title: Computer name
      description: The NetBIOS name it announces in the negotiation and in the NTLM challenge. It should fit the file servers on the network (FS01, NAS01).
      pattern: '^[A-Za-z0-9-]{1,15}$'
      default: FS01
    dominio:
      type: string
      x-camuflaje: 'netbios'
      title: Domain or workgroup
      description: The domain/group it announces. Use your network's so it looks like one more server.
      pattern: '^[A-Za-z0-9-]{1,15}$'
      default: WORKGROUP
    recursos:
      type: string
      title: Shared resources
      description: >-
        Believable resource names, comma-separated (Finanzas, RRHH, Backups).
        They make the decoy more believable and appear in the log; the decoy
        accepts the connection to any resource and never serves real data.
      pattern: '^[^\x00]{0,256}$'
      maxLength: 256
      default: 'Finanzas,RRHH,Backups,IT$'

eventos:
  fuente: { tipo: fichero, ruta: smb.json }
  formato: json-lineas
  campos:
    cuando: cuando
    ip: src_ip
    puerto: src_port
    usuario: usuario
    equipo: equipo
  accion:
    campo: eventid
    valores:
      smb.session.connect: conexion
      smb.session.negotiate: conexion
      smb.session.auth: autenticacion
      smb.session.anonymous: autenticacion
      smb.session.rechazos: otra
      smb.tree.connect: lectura
      smb.file.open: lectura
      smb.file.write: escritura
      smb.rpc.call: comando
      smb.exploit: comando
    porDefecto: otra
  severidad:
    porDefecto: media
    porValor:
      smb.session.connect: baja
      smb.session.negotiate: baja
      smb.session.auth: alta
      smb.session.anonymous: media
      smb.tree.connect: media
      smb.file.open: media
      smb.file.write: alta
      smb.rpc.call: media
      smb.exploit: critica
      smb.log.omitidos: alta
      smb.session.rechazos: alta
  conexionEstablecida: true
  detalle:
    - eventid
    - dst_port
    - proto
    - dialecto
    - dominio
    - password
    - ntlm_version
    - ntlm_hash
    - reto
    - recurso
    - fichero
    - huella
    - tamano
    - interfaz
    - opnum
    - comando
    - grave
    - variante
    - motivo_cierre
    - omitidos
    - por_tipo
    - ips_ruidosas
    - ips_distintas
    - periodo_s
    - tope_bytes
    - motivo
    - error
  contrasena: password
  sesion: session
  resumen: [dominio, recurso, fichero, grave, ntlm_version, comando, interfaz, omitidos, motivo]
  etiquetas:
    eventid: Event
    dst_port: Port
    proto: Transport
    dialecto: SMB dialect
    dominio: Domain
    password: Password (if sent in plaintext)
    ntlm_version: NTLM type
    ntlm_hash: NetNTLM hash (hex)
    reto: Server challenge (hex)
    recurso: Shared resource
    fichero: File
    huella: Content fingerprint (SHA-256)
    tamano: Size captured (bytes)
