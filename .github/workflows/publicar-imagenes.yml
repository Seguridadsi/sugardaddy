# Construye desde su fuente y publica en el registro de contenedores de GitHub
# (ghcr.io/<org>): cowrie, la trampa de código libre (y fija su digest real en su
# manifiesto) y las 3 imágenes del nodo (consola, sensor, actualizador), etiquetadas con la
# versión de despliegue/nodo/VERSION. Usa el GITHUB_TOKEN propio del repositorio:
# no hace falta ningún token ni secreto aparte. Se lanza a mano (workflow_dispatch)
# para no entrar en bucle con el commit de los digests.
name: Publicar imágenes (trampas y nodo)

on:
  workflow_dispatch: {}

# Nada por defecto: cada trabajo pide solo lo suyo. Las acciones van fijadas
# por SHA (las mismas que pruebas.yml) y solo se publica desde main: lo que
# sale de aquí lo firma Kino y lo instalan los nodos (SUP-5).
permissions: {}

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # el commit con el digest de cowrie
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Entrar en ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir, publicar y fijar los digests
        run: |
          set -euo pipefail
          org=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Las trampas de registro son cerradas: no se construyen aquí.
          for t in cowrie; do
            etq=$(tr -d '[:space:]' < "modulos/trampas/$t/imagen/etiqueta")
            repo="ghcr.io/$org/sugardaddy-trampa-$t"
            echo "::group::$t -> $repo:$etq"
            # Una etiqueta publicada no se reescribe: para otra imagen, otra etiqueta.
            if docker manifest inspect "$repo:$etq" >/dev/null 2>&1; then
              echo "$repo:$etq is already published: it is not overwritten"
              echo "::endgroup::"
              continue
            fi
            tmp=$(mktemp -d)
            "modulos/trampas/$t/imagen/preparar.sh" "$tmp/fuente"
            df="$tmp/fuente/Dockerfile"; [ -f "$df" ] || df="$tmp/fuente/docker/Dockerfile"
            docker build --platform linux/amd64 -t "$repo:$etq" -f "$df" "$tmp/fuente"
            docker push "$repo:$etq"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$repo:$etq" | sed 's/^[^@]*@//')
            perl -pi -e "s{(imagen(?:Publica)?:\s*\Q$repo:$etq\E)\@sha256:[0-9a-f]{64}}{\${1}\@$digest}" "modulos/trampas/$t/trampa.yaml"
            rm -rf "$tmp"
            echo "::endgroup::"
          done

      - name: Confirmar los digests reales en los manifiestos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modulos/trampas/*/trampa.yaml
          git commit -m "Fijar el digest real de ghcr de la imagen de cowrie" || echo "sin cambios que confirmar"
          git push

  nodo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Procedencia firmada de cada imagen: antes de firmar la versión, publicar-community.sh
      # comprueba con «gh attestation verify» que la construyó este Action (SUP-4).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Entrar en ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir y publicar las imágenes del nodo en ghcr
        id: publicar
        run: |
          set -euo pipefail
          org=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          V=$(tr -d '[:space:]' < despliegue/nodo/VERSION)
          # Reutiliza el mismo molde que el build local: consola (con el catálogo
          # encima), sensor y actualizador (con docker-compose embebido).
          # Una versión publicada no se reescribe: la firma de Kino es de esa.
          for svc in consola sensor actualizador; do
            if docker manifest inspect "ghcr.io/$org/sugardaddy-$svc:$V" >/dev/null 2>&1; then
              echo "ghcr.io/$org/sugardaddy-$svc:$V is already published: bump despliegue/nodo/VERSION" >&2
              exit 1
            fi
          done
          despliegue/nodo/construir-imagenes-local.sh "$V"
          echo "org=$org" >> "$GITHUB_OUTPUT"
          for svc in consola sensor actualizador; do
            docker tag "sugardaddy-$svc:$V" "ghcr.io/$org/sugardaddy-$svc:$V"
            docker push "ghcr.io/$org/sugardaddy-$svc:$V"
            docker inspect --format="$svc -> {{index .RepoDigests 0}}" "ghcr.io/$org/sugardaddy-$svc:$V"
            echo "$svc=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/$org/sugardaddy-$svc:$V" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          done

      - name: Procedencia firmada de la consola
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.publicar.outputs.org }}/sugardaddy-consola
          subject-digest: ${{ steps.publicar.outputs.consola }}
          push-to-registry: true

      - name: Procedencia firmada del sensor
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.publicar.outputs.org }}/sugardaddy-sensor
          subject-digest: ${{ steps.publicar.outputs.sensor }}
          push-to-registry: true

      - name: Procedencia firmada del actualizador
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.publicar.outputs.org }}/sugardaddy-actualizador
          subject-digest: ${{ steps.publicar.outputs.actualizador }}
          push-to-registry: true
